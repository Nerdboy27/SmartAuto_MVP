<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAuto Portal</title>
<style>
  body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; height: 100vh; }
  #ad-space { width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; color: #333; }
  
  /* Single Button */
  #btn-hub { position: absolute; top: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #4CAF50; display: flex; justify-content: center; align-items: center; font-size: 28px; cursor: pointer; z-index: 500; }
  
  /* Menu Overlay */
  #menu-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 1000; padding: 20px; box-sizing: border-box; }
  .menu-btn { display: block; width: 100%; padding: 20px; margin-bottom: 10px; background: #222; border: 1px solid #4CAF50; color: white; font-size: 1.2rem; border-radius: 10px; }
  
  /* Game Styles */
  #game-ui { display: none; text-align: center; margin-top: 20px; }
  .arrow-btn { padding: 20px; font-size: 30px; margin: 5px; background: #333; border: none; color: white; border-radius: 10px; }
</style>
</head>
<body>

<div id="ad-space">AD SLOT 1</div>
<div id="btn-hub" onclick="openHub()">🎮</div>

<div id="menu-overlay">
  <span class="close-btn" onclick="closeHub()" style="font-size:30px; float:right;">X</span>
  <h2 style="text-align:center;">SmartAuto Portal</h2>
  
  <div id="main-menu">
    <button class="menu-btn" onclick="showGame()">Play Arrow Puzzle</button>
    <button class="menu-btn" onclick="showLeaderboard()">🏆 Leaderboard</button>
  </div>

  <div id="game-ui">
    <input type="text" id="p-name" placeholder="Enter Name..." style="padding:10px; width:80%;">
    <button onclick="startGame()" style="background:#4CAF50; padding:10px; border:none; color:white;">Start</button>
    <div id="game-play" style="display:none;">
      <h3 id="level-text">Level: 1</h3>
      <div id="timer" style="color:red; font-size:1.5rem;">60s</div>
      <div id="arrow-sequence" style="font-size:2rem; margin:20px;"></div>
      <div>
        <button class="arrow-btn" onclick="playerMove('⬆️')">⬆️</button>
        <button class="arrow-btn" onclick="playerMove('➡️')">➡️</button>
        <button class="arrow-btn" onclick="playerMove('⬇️')">⬇️</button>
        <button class="arrow-btn" onclick="playerMove('⬅️')">⬅️</button>
      </div>
    </div>
  </div>

  <div id="leaderboard-ui" style="display:none;">
    <h3>Top Players</h3>
    <ul id="rank-list" style="list-style:none;"><li>1. Rahul - 1200</li><li>2. Amit - 1050</li></ul>
  </div>
</div>

<script>
  let level = 1, sequence = [], userIndex = 0, timer, timeLeft = 60;
  const arrows = ['⬆️', '➡️', '⬇️', '⬅️'];

  function openHub() { document.getElementById('menu-overlay').style.display = 'block'; }
  function closeHub() { document.getElementById('menu-overlay').style.display = 'none'; clearInterval(timer); }
  function showGame() { document.getElementById('main-menu').style.display='none'; document.getElementById('game-ui').style.display='block'; }
  function showLeaderboard() { document.getElementById('main-menu').style.display='none'; document.getElementById('leaderboard-ui').style.display='block'; }

  function generateLevel() {
    sequence = Array.from({length: level + 2}, () => arrows[Math.floor(Math.random()*4)]);
    document.getElementById('arrow-sequence').innerText = sequence.join(' ');
    userIndex = 0;
  }

  function startGame() {
    if(!document.getElementById('p-name').value) return alert("Enter Name");
    document.getElementById('game-play').style.display = 'block';
    generateLevel();
    timer = setInterval(() => {
      timeLeft--;
      document.getElementById('timer').innerText = timeLeft + "s";
      if(timeLeft <= 0) { clearInterval(timer); alert("Time Up!"); closeHub(); }
    }, 1000);
  }

  function playerMove(move) {
    if(move === sequence[userIndex]) {
      userIndex++;
      if(userIndex === sequence.length) { level++; document.getElementById('level-text').innerText = "Level: "+level; generateLevel(); }
    } else { alert("Wrong Move!"); }
  }
</script>
</body>
</html>
